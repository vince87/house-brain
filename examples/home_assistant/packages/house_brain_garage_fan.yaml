# Copy this package into the Home Assistant packages directory.
# It deliberately sends only simulate events during the first rollout.

rest_command:
  house_brain_event:
    url: !secret house_brain_events_url
    method: POST
    headers:
      X-API-Key: !secret house_brain_api_key
    content_type: application/json
    timeout: 150
    payload: >-
      {
        "mode": {{ event_mode | default("simulate") | tojson }},
        "instruction": {{ instruction | tojson }}
      }

automation:
  - id: house_brain_garage_fan_humidity
    alias: House Brain - Ventola garage in simulazione
    description: >-
      Invia a House Brain eventi di umidità e fine finestra notturna.
      Nessuna azione reale viene eseguita in questa fase.
    triggers:
      - trigger: numeric_state
        entity_id: sensor.openweathermap_humidity
        above: 80
        id: humidity_high

      - trigger: numeric_state
        entity_id: sensor.openweathermap_humidity
        below: 60
        id: humidity_low

      - trigger: time
        at: "06:00:00"
        id: night_window_ended

    conditions: []

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'humidity_high' }}"
              - condition: time
                after: "20:00:00"
                before: "06:00:00"
            sequence:
              - action: rest_command.house_brain_event
                data:
                  event_mode: simulate
                  instruction: >-
                    Controlla switch.example_fan_relay. Se è spento, simula
                    l'accensione a causa dell'umidità esterna superiore
                    all'80 per cento.

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'humidity_low' }}"
            sequence:
              - action: rest_command.house_brain_event
                data:
                  event_mode: simulate
                  instruction: >-
                    Controlla switch.example_fan_relay. Se è acceso, simula
                    lo spegnimento perché l'umidità esterna è scesa
                    sotto il 60 per cento.

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'night_window_ended' }}"
            sequence:
              - action: rest_command.house_brain_event
                data:
                  event_mode: simulate
                  instruction: >-
                    Controlla switch.example_fan_relay. Se è acceso, simula
                    lo spegnimento perché la finestra notturna è terminata.

    mode: queued
    max: 3
