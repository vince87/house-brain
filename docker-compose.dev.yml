services:
  house-brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: house-brain:local
    container_name: house-brain
    restart: unless-stopped
    init: true

    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Rome}"
      HOME_ASSISTANT_URL: "${HOME_ASSISTANT_URL}"
      HOME_ASSISTANT_TOKEN: "${HOME_ASSISTANT_TOKEN}"
      HOME_ASSISTANT_TIMEOUT: "${HOME_ASSISTANT_TIMEOUT:-10}"
      HOME_ASSISTANT_SERVICE_CACHE_TTL: "${HOME_ASSISTANT_SERVICE_CACHE_TTL:-300}"
      HOUSE_BRAIN_API_KEY: "${HOUSE_BRAIN_API_KEY}"
      HOUSE_BRAIN_LANGUAGE: "${HOUSE_BRAIN_LANGUAGE:-it}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      AUTONOMY_POLICY_PATH: "${AUTONOMY_POLICY_PATH:-/config/autonomy.yaml}"
      AUTONOMY_BACKUP_PATH: "${AUTONOMY_BACKUP_PATH:-/config/autonomy-backups}"
      AUTONOMOUS_EXECUTION_ENABLED: "${AUTONOMOUS_EXECUTION_ENABLED:-false}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:12b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-120}"
      OLLAMA_CONTEXT_WINDOW: "${OLLAMA_CONTEXT_WINDOW:-16384}"
      OLLAMA_MAX_OUTPUT_TOKENS: "${OLLAMA_MAX_OUTPUT_TOKENS:-4096}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0.1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_TIMEOUT: "${OPENAI_TIMEOUT:-120}"
      OPENAI_MAX_OUTPUT_TOKENS: "${OPENAI_MAX_OUTPUT_TOKENS:-4096}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      WEB_SEARCH_TIMEOUT: "${WEB_SEARCH_TIMEOUT:-10}"
      WEB_SEARCH_MAX_RESULTS: "${WEB_SEARCH_MAX_RESULTS:-10}"
      MEMORY_DATABASE_PATH: "${MEMORY_DATABASE_PATH:-/config/house_brain.db}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8090:8090"

    volumes:
      - ./config:/config:rw

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8090/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    stop_grace_period: 15s
