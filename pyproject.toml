[project]
name = "house-brain"
version = "0.1.0"
description = "AI middleware between LLMs and Home Assistant"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name="Vincenzo"}
]

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "httpx>=0.28",
    "loguru>=0.7",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]

dev = [
    "httpx2>=2.9.1",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]

line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
]

[build-system]

requires = ["hatchling"]

build-backend = "hatchling.build"

