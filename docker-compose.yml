services:
  house-brain:
    image: ghcr.io/vince87/house-brain:0.1.0
    container_name: house-brain
    restart: unless-stopped
    init: true

    environment:
      TZ: "Europe/Rome"
      HOME_ASSISTANT_URL: "http://homeassistant.local:8123"
      HOME_ASSISTANT_TOKEN: "replace-with-a-long-lived-access-token"
      HOME_ASSISTANT_TIMEOUT: "10"
      HOME_ASSISTANT_SERVICE_CACHE_TTL: "300"
      HOUSE_BRAIN_API_KEY: "replace-with-a-random-secret"
      HOUSE_BRAIN_LANGUAGE: "it"
      AUTONOMY_POLICY_PATH: "/config/autonomy.yaml"
      AUTONOMY_BACKUP_PATH: "/config/autonomy-backups"
      AUTONOMOUS_EXECUTION_ENABLED: "false"
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "gemma4:12b"
      OLLAMA_TIMEOUT: "120"
      SEARXNG_URL: ""
      WEB_SEARCH_TIMEOUT: "10"
      WEB_SEARCH_MAX_RESULTS: "10"
      MEMORY_DATABASE_PATH: "/config/house_brain.db"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8090:8090"

    volumes:
      - ./config:/config:rw

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8090/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    stop_grace_period: 15s
