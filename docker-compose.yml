services:
  house-brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: house-brain:local
    container_name: house-brain
    restart: unless-stopped
    init: true

    env_file:
      - .env
    environment:
      TZ: Europe/Rome

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8090:8090"

    volumes:
      - house_brain_data:/data
      - ./autonomy.yaml:/app/autonomy.yaml:rw

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8090/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    stop_grace_period: 15s

volumes:
  house_brain_data:
